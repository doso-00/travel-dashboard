name: Aggiorna prezzi e pubblica

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches-ignore: [gh-pages]

permissions:
  contents: write
  pages: write

concurrency:
  group: update-fares
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      # Lo storico dei prezzi vive nel file pubblicato: si riparte da lì.
      - name: Recupera i prezzi precedenti
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Scarica i prezzi reali e invia gli alert
        run: npm run update-fares -- --previous previous/data/fares.json --out public/data/fares.json
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

      - run: npm run build

      - name: Pubblica su gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: Aggiorna prezzi

      # Attiva GitHub Pages sul branch gh-pages se non è già attivo (può richiedere
      # i permessi di amministratore: in quel caso resta il link raw.githack.com).
      - name: Attiva GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null && echo "Pages già attivo" && exit 0
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" && echo "Pages attivato"

      - name: Indirizzi della dashboard
        continue-on-error: true
        run: |
          for url in "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
                     "https://raw.githack.com/${{ github.repository }}/gh-pages/index.html" \
                     "https://raw.githack.com/${{ github.repository }}/gh-pages/data/fares.json"; do
            echo "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$url") $url"
          done
